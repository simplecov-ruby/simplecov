name: stable

# Push is scoped to main so a pull request runs this once rather than twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    env:
      BUNDLE_WITHOUT: "benchmark"
      JRUBY_OPTS: "--debug"
    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]
        ruby-version:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - jruby-10.0
        include:
          - os: macos-latest
            ruby-version: ruby
          - os: windows-latest
            ruby-version: ruby

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Remove Gemfile.lock
        run: rm Gemfile.lock
        shell: bash

      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          rubygems: default
          bundler-cache: true

      # The sandbox specs skip themselves on alternative Ruby implementations
      # and on Windows (see spec/support/sandbox_project.rb), and the frontend
      # tests skip when bun isn't installed, so every matrix entry runs the
      # same task.
      - name: Run tests
        run: bundle exec rake test
