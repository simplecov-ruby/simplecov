name: lint

# Push is scoped to main so a pull request runs this once rather than twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ruby
          bundler-cache: true

      - run: bundle exec rake rubocop
