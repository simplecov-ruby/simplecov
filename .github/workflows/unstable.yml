name: unstable

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BUNDLE_WITHOUT: "benchmark"
      JRUBY_OPTS: "--debug"
    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]
        ruby-version:
          - ruby-head
          - jruby-head
          - truffleruby
          - truffleruby-head
        include:
          - os: macos-latest
            ruby-version: ruby-head
          - os: windows-latest
            ruby-version: ruby-head

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      # The sandbox specs skip themselves on alternative Ruby implementations
      # and on Windows (see spec/support/sandbox_project.rb), and the frontend
      # tests skip when bun isn't installed, so every matrix entry runs the
      # same task.
      - name: Run tests
        run: bundle exec rake test
