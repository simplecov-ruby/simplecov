name: unstable

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BUNDLE_WITHOUT: "benchmark"
      JRUBY_OPTS: "--debug"
    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]
        ruby-version:
          - ruby-head
          - jruby-head
          - truffleruby
          - truffleruby-head
        include:
          - os: macos-latest
            ruby-version: ruby-head
          - os: windows-latest
            ruby-version: ruby-head

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      # The sandbox specs skip themselves on alternative Ruby implementations
      # and on Windows (see spec/support/sandbox_project.rb), and the frontend
      # tests skip when bun isn't installed, so every matrix entry runs the
      # same task.
      - name: Run tests
        run: bundle exec rake test

  # The extractor synthesizes the branch tuples Ruby's Coverage would have
  # emitted for files no process loaded, so a convention change in a
  # prerelease Ruby shows up here as a differential mismatch rather than as
  # phantom branches in someone's report. Prism-only, so CRuby alone.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUNDLE_WITHOUT: "benchmark"

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ruby-head
          bundler-cache: true

      - name: Fuzz the static coverage extractor against Coverage
        run: bundle exec rake "fuzz[500]"
