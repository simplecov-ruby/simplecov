name: unstable

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BUNDLE_WITHOUT: "benchmark"
      JRUBY_OPTS: "--debug"
    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]
        # JRuby takes several times as long as any other entry here, so it
        # leads the list: the scheduler dispatches matrix entries in order, and
        # starting the long pole first keeps it off the critical path.
        ruby-version:
          - jruby-head
          - ruby-head
          - truffleruby
          - truffleruby-head
        include:
          - os: macos-latest
            ruby-version: ruby-head
          - os: windows-latest
            ruby-version: ruby-head

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          # ruby-head ships the matching development Bundler. Installing the
          # older BUNDLED WITH version beside it can leave the executable and
          # default-gem specification disagreeing about which version loaded.
          bundler: ${{ matrix.ruby-version == 'ruby-head' && 'default' || 'Gemfile.lock' }}
          bundler-cache: true

      # rake spec groups by runtime when tmp/parallel_runtime_rspec.log exists,
      # and a fresh checkout has no tmp/. The key carries the sha so every run
      # writes a fresh log and restore-keys picks the last one up. A log from a
      # different spec layout is rejected by the task itself, not here.
      - uses: actions/cache@v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ matrix.os }}-${{ matrix.ruby-version }}-${{ github.sha }}
          restore-keys: |
            parallel-runtime-${{ matrix.os }}-${{ matrix.ruby-version }}-

      # The sandbox specs skip themselves on alternative Ruby implementations
      # and on Windows (see spec/support/sandbox_project.rb), and the frontend
      # tests skip when bun isn't installed, so every matrix entry runs the
      # same task.
      - name: Run tests
        run: bundle exec rake test

  # The extractor synthesizes the branch tuples Ruby's Coverage would have
  # emitted for files no process loaded, so a convention change in a
  # prerelease Ruby shows up here as a differential mismatch rather than as
  # phantom branches in someone's report. Prism-only, so CRuby alone.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUNDLE_WITHOUT: "benchmark"

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ruby-head
          bundler: default
          bundler-cache: true

      - name: Fuzz the static coverage extractor against Coverage
        run: bundle exec rake "fuzz[500]"
