name: mutation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mutation:
    runs-on: ubuntu-latest
    # Only the touched subjects are analysed, but a change to a slow
    # namespace (the CLI subcommands that shell out, SimpleCov itself)
    # is still minutes of work per subject.
    timeout-minutes: 30

    env:
      BUNDLE_WITHOUT: "benchmark"

    steps:
      # Mutant selects subjects by diffing against a revision, so the
      # revision has to be in the clone: a shallow one has nothing to
      # compare against.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ruby
          rubygems: default
          bundler-cache: true

      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.base_ref }}

      # Keeps the analysis to the subjects whose own lines the pull
      # request touched, rather than the whole library: mutant matches
      # each subject's line range against the diff, so an untouched
      # method in a touched file is left alone too.
      #
      # A pull request that touches no library code selects nothing and
      # passes, which is what a docs- or spec-only change should do.
      - name: Analyse the mutations the pull request touches
        if: github.event_name == 'pull_request'
        run: bundle exec rake "mutant:since[origin/${{ github.base_ref }}]"

      # The same analysis for a push, against the head the push replaced,
      # so a multi-commit push is diffed as a whole. A force push can
      # leave that head unreachable. Then the diff falls back to the tip
      # commit alone, which covers the amend-and-push case that produces
      # most force pushes here.
      - name: Analyse the mutations the push touches
        if: github.event_name == 'push'
        run: |
          base="${{ github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base" 2>/dev/null || base="HEAD~1"
          fi
          echo "Comparing against $base"
          bundle exec rake "mutant:since[$base]"
